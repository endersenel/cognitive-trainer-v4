<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>SPPLab - Performance Studio</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;margin:0;padding:0;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#err-banner{display:none;background:#b71c1c;color:#fff;font-size:.7rem;padding:4px 8px;user-select:text;-webkit-user-select:text;flex-shrink:0}
header{background:#151515;padding:6px 10px;text-align:center;border-bottom:1px solid #333;flex-shrink:0}
h1{margin:0 0 6px;font-size:clamp(.85rem,3vw,1.1rem);color:#00e5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-bar{display:flex;gap:4px;justify-content:center;align-items:center;width:100%;flex-wrap:wrap;margin-bottom:6px}
.demo-field{display:flex;flex-direction:column;align-items:flex-start}
.demo-field label{font-size:.6rem;color:#00e5ff;margin-bottom:1px;font-weight:bold}
.demo-field input,.demo-field select{background:#222;color:#fff;border:1px solid #00e5ff;padding:4px 5px;border-radius:4px;font-size:clamp(.65rem,2vw,.75rem);outline:none;user-select:text;-webkit-user-select:text}
.panel-row{display:flex;gap:6px;justify-content:center;align-items:center;width:100%}
#module-select,#mode-select{background:#222;color:#fff;border:1px solid #00e5ff;padding:6px 8px;border-radius:6px;font-size:clamp(.7rem,2.5vw,.85rem);outline:none;min-width:0}
#module-select{flex:1;max-width:340px}
#mode-select{flex:0 0 auto;max-width:170px}
.extra-options{display:none;gap:10px;justify-content:center;align-items:center;margin-top:5px;font-size:.75rem;color:#00e5ff}
.extra-options select{background:#222;color:#fff;border:1px solid #00e5ff;padding:2px 6px;border-radius:4px}
.consent-row{margin-top:5px;font-size:.65rem;color:#aaa;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
#sync-status{color:#888}
#stats-bar{display:flex;justify-content:space-between;background:#1a1a1a;padding:6px 12px;font-size:clamp(.65rem,2.2vw,.8rem);font-weight:bold;border-bottom:1px solid #333;flex-shrink:0}
.stat-item span{color:#00e676}
#game-area{flex:1;position:relative;width:100%;overflow:hidden;background:#0e0e0e;display:flex;justify-content:center;align-items:center;padding:10px}
#game-area.has-buttons{padding-bottom:90px}
@keyframes fbok{0%{box-shadow:inset 0 0 0 6px #00e676}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes fbbad{0%{box-shadow:inset 0 0 0 6px #ff1744}100%{box-shadow:inset 0 0 0 0 transparent}}
#game-area.fb-ok{animation:fbok .4s}
#game-area.fb-bad{animation:fbbad .4s}
#instruction-card{position:absolute;width:min(92%,480px);max-height:92%;overflow-y:auto;background:rgba(20,20,20,.98);border:2px solid #00e5ff;padding:16px;border-radius:12px;text-align:left;z-index:1000;user-select:text;-webkit-user-select:text}
#instruction-card h3{margin-top:0;color:#00e5ff;font-size:clamp(.95rem,3.5vw,1.2rem);text-align:center}
#instruction-card p{font-size:clamp(.72rem,2.6vw,.85rem);line-height:1.5;color:#ddd;margin-bottom:6px}
.eval-info{background:#181818;border-left:3px solid #00e5ff;padding:6px 8px;font-size:.72rem;color:#bbb;margin-top:6px}
.score-info{background:#111;border-left:3px solid #00e676;padding:6px 8px;font-size:.72rem;color:#aaa;margin-top:6px}
.legs{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-top:6px;font-size:.72rem;background:#111;padding:6px 8px;border-radius:6px}
.legs div{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:1px 0}
.legs .best{color:#00e676;font-weight:bold}
.legs .worst{color:#ff5252;font-weight:bold}
#antisaccade-touch-zone{display:none;position:absolute;width:100%;height:100%;top:0;left:0;z-index:50}
.antisaccade-half{position:absolute;width:50%;height:100%;top:0}
#antisaccade-left-zone{left:0;border-right:1px dashed rgba(255,255,255,.1)}
#antisaccade-right-zone{right:0}
#dual-buttons{display:none;width:calc(100% - 20px);max-width:400px;gap:20px;justify-content:center;z-index:100;position:absolute;bottom:15px}
.choice-btn{flex:1;padding:16px 0;font-size:1rem;font-weight:bold;border-radius:10px;border:2px solid #fff;text-align:center;color:#fff}
.btn-left{background:#ff1744}.btn-right{background:#29b6f6}
#target-circle{position:absolute;transform:translate(-50%,-50%);width:clamp(100px,25vw,140px);height:clamp(100px,25vw,140px);border-radius:50%;background:#000;border:3px solid #fff;display:none;justify-content:center;align-items:center;font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;text-align:center;padding:8px;z-index:200}
#target-circle.wide{width:auto;height:auto;min-width:150px;border-radius:18px;padding:14px 22px;letter-spacing:2px;white-space:nowrap}
#spatial-grid{display:none;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;width:100%;height:100%;max-width:500px;max-height:500px;margin:auto;z-index:100}
#spatial-grid.compact{height:52%;align-self:flex-end}
.spatial-btn{border-radius:12px;opacity:.3;transition:opacity .1s;display:flex;justify-content:center;align-items:center;font-size:clamp(1.1rem,4vw,1.6rem);font-weight:900;color:#000;border:2px solid #fff;width:100%;height:100%}
.spatial-btn.active{opacity:1;box-shadow:0 0 35px #fff;transform:scale(.98)}
#spatial-grid.all-on .spatial-btn{opacity:1}
#memory-grid{display:none;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;width:min(70vw,280px);aspect-ratio:1;margin:auto;z-index:100}
.memory-block{background:#222;border:2px solid #00e5ff;border-radius:8px;width:100%;height:100%}
.memory-block.lit{background:#00e5ff!important;box-shadow:0 0 25px #00e5ff!important}
#numpad-grid{display:none;grid-template-columns:repeat(3,1fr);gap:8px;width:min(75vw,260px);margin:auto;z-index:100}
.num-btn{background:#222;border:1px solid #00e5ff;color:#fff;font-size:1.2rem;font-weight:bold;padding:12px 0;border-radius:6px;text-align:center}
#trail-area{display:none;position:relative;width:100%;align-self:stretch;flex:1;z-index:100}
#trail-area svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.trail-node{position:absolute;width:46px;height:46px;border-radius:50%;background:#00e5ff;color:#000;font-weight:900;font-size:1rem;display:flex;justify-content:center;align-items:center;border:2px solid #fff;z-index:2}
.trail-node.done{background:#00e676;opacity:.35}
#cv{display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;touch-action:none}
#controls{padding:8px 10px;background:#151515;display:flex;gap:6px;justify-content:center;flex-shrink:0;border-top:1px solid #333;width:100%}
button{flex:1;max-width:140px;min-height:44px;padding:10px 0;font-size:clamp(.68rem,2.4vw,.9rem);font-weight:bold;border:none;border-radius:6px;cursor:pointer;color:#fff}
.btn-start{background:#00c853}.btn-stop{background:#d50000}.btn-export{background:#0288d1}.btn-report{background:#6a1b9a}.btn-mute{background:#444;max-width:80px}
button:disabled{background:#333!important;color:#666!important;cursor:not-allowed}
#report-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:5000;background:#0a0a0a;overflow-y:auto;-webkit-overflow-scrolling:touch}
#report-overlay.open{display:block}
#report-overlay *{user-select:text;-webkit-user-select:text}
#report-bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:6px;background:#151515;border-bottom:1px solid #333;padding:6px 10px;z-index:2}
#report-bar b{color:#00e5ff;font-size:.85rem}
#report-bar span{display:flex;gap:6px}
#report-bar button{flex:none;min-height:36px;padding:6px 12px;max-width:none;background:#0288d1}
#report-body{max-width:760px;margin:0 auto;padding:12px;font-size:.8rem;line-height:1.5;color:#ddd}
.rp-title{font-size:1.15rem;color:#00e5ff;font-weight:bold}
.rp-sub{color:#999;font-size:.72rem}
.rp-sec{border-top:1px solid #333;margin-top:12px;padding-top:8px}
.rp-sec h4{margin:0 0 6px;color:#00e5ff;font-size:.9rem}
.rp-sec ul{margin:0;padding-left:18px}
.rp-card{border:1px solid #333;background:#121212;padding:10px;margin-top:10px}
.rp-ct{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold;color:#fff}
.rp-ct span{font-weight:normal;color:#888;font-size:.7rem}
.rp-card table{width:100%;border-collapse:collapse;margin:6px 0;font-size:.74rem}
.rp-card td{border-bottom:1px solid #222;padding:3px 4px;vertical-align:top}
.rp-card td:first-child{color:#999;width:46%}
.rp-cm{border-left:3px solid;padding:2px 8px;margin:4px 0}
.rp-tr{color:#b39ddb;font-size:.74rem;margin-top:4px}
.rp-note{color:#888;font-size:.7rem;margin-top:10px}
@media print{
html,body{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
body>*:not(#report-overlay){display:none!important}
#report-overlay.open{position:static!important;background:#fff!important;overflow:visible!important}
#report-bar{display:none!important}
#report-body,#report-body *{color:#000!important;background:transparent!important;border-color:#999!important}
.rp-card{break-inside:avoid}
}
</style>
</head>
<body>
<div id="err-banner"></div>
<header>
<h1>SPPLab - Performance Studio</h1>
<div class="demo-bar">
<div class="demo-field"><label>Sporcu ID (takma)</label><input type="text" id="athlete-id" value="SP-101" maxlength="32" style="width:85px"></div>
<div class="demo-field"><label>Yaş</label><input type="number" id="athlete-age" value="22" min="5" max="99" style="width:45px"></div>
<div class="demo-field"><label>Cinsiyet</label><select id="athlete-gender" style="width:65px"><option value="Erkek">Erkek</option><option value="Kadin">Kadın</option></select></div>
<div class="demo-field"><label>Branş</label><input type="text" id="athlete-sport" value="Futbol" maxlength="32" style="width:70px"></div>
<div class="demo-field"><label>Baskın El</label><select id="athlete-dominant" style="width:55px"><option value="Sag">Sağ</option><option value="Sol">Sol</option></select></div>
<div class="demo-field"><label>Spor Yılı</label><input type="number" id="athlete-exp" value="5" min="0" max="80" style="width:55px"></div>
</div>
<div class="panel-row">
<select id="module-select">
<optgroup label="A. Bilişsel İnhibisyon & Çatışma">
<option value="gonogo">1. Go/No-Go (Baskılama)</option>
<option value="stroop">2. Stroop (Renk-Kelime Çelişkisi)</option>
<option value="simon">3. Simon Effect (Mekânsal Çatışma)</option>
<option value="flanker">4. Flanker Testi (Çeldirici Dikkat)</option>
<option value="antisaccade">5. Anti-Saccade (Refleks Baskılama)</option>
</optgroup>
<optgroup label="B. Nöropsikolojik & Bellek">
<option value="trailA">6. Trail Making A (1-20 Sayı)</option>
<option value="trailB">7. Trail Making B (1-A-2-B...)</option>
<option value="memory">8. Görsel Dizilim Bellek (Corsi)</option>
<option value="nback">9. Spatial N-Back Bellek</option>
<option value="digit_span">10. Görsel Sayı Dizilimi Belleği</option>
</optgroup>
<optgroup label="C. Saha & Kinetik Depar">
<option value="sprint_ball">11. Saha Depar: Top Getirme</option>
<option value="agility_run">12. Renk Koni Çeviklik Deparı</option>
<option value="complex_agility">13. Karmaşık Çift Komut Deparı (Go/No-Go)</option>
<option value="choice_react">14. Çoklu Seçenek Reaksiyon Deparı</option>
<option value="visual_search">15. Görsel Arama & Depar</option>
</optgroup>
<optgroup label="D. Uyanıklık, Zamanlama & Dikkat">
<option value="pvt">16. Basit Reaksiyon (PVT - Uyanıklık)</option>
<option value="stopsignal">17. Stop-Signal (Eylem Durdurma)</option>
<option value="taskswitch">18. Görev Değiştirme (Esneklik)</option>
<option value="mot">19. Çoklu Nesne Takibi (MOT)</option>
<option value="timing">20. Öngörü Zamanlaması (Anticipation)</option>
</optgroup>
</select>
<select id="mode-select"><option value="quick">Hızlı (ön fikir)</option><option value="rel">Güvenilir tek seans</option></select>
</div>
<div class="extra-options" id="opt-digit"><label>Başlangıç uzunluğu: </label><select id="digit-length-select"><option value="4">4 Basamak (Kolay)</option><option value="8">8 Basamak (Zor)</option></select></div>
<div class="extra-options" id="opt-nback"><label>N seviyesi: </label><select id="nback-n-select"><option value="1">1-back</option><option value="2">2-back</option><option value="3">3-back</option></select></div>
<div class="consent-row"><label><input type="checkbox" id="consent"> Verilerimin araştırma amacıyla sunucuya gönderilmesine açık rıza veriyorum (kapalıysa veri sadece bu cihazda kalır).</label><span id="sync-status"></span></div>
</header>

<div id="stats-bar">
<div class="stat-item">Deneme: <span id="stat-trials">0/10</span></div>
<div class="stat-item">Sayaç: <span id="stat-timer">0.00 s</span></div>
<div class="stat-item">Puan: <span id="stat-score">0</span></div>
<div class="stat-item">Hata: <span id="stat-errors">0</span></div>
</div>

<div id="game-area">
<div id="instruction-card"><h3 id="instr-title">Test Yönergesi</h3><p id="instr-text">Test yükleniyor...</p><div id="instr-eval" class="eval-info"></div><div id="instr-score-formula" class="score-info"></div></div>
<div id="antisaccade-touch-zone"><div id="antisaccade-left-zone" class="antisaccade-half"></div><div id="antisaccade-right-zone" class="antisaccade-half"></div></div>
<canvas id="cv"></canvas>
<div id="target-circle"></div>
<div id="dual-buttons"><div class="choice-btn btn-left" id="btn-left-opt">SOL</div><div class="choice-btn btn-right" id="btn-right-opt">SAĞ</div></div>
<div id="spatial-grid">
<div class="spatial-btn" data-key="red" style="background:#ff1744"></div>
<div class="spatial-btn" data-key="blue" style="background:#29b6f6"></div>
<div class="spatial-btn" data-key="green" style="background:#00e676"></div>
<div class="spatial-btn" data-key="yellow" style="background:#ffea00"></div>
</div>
<div id="memory-grid"></div>
<div id="numpad-grid"></div>
<div id="trail-area"></div>
</div>

<div id="controls">
<button id="start-btn" class="btn-start">Başlat</button>
<button id="stop-btn" class="btn-stop" disabled>Durdur</button>
<button id="export-btn" class="btn-export" disabled>CSV İndir</button>
<button id="report-btn" class="btn-report">Rapor</button>
<button id="mute-btn" class="btn-mute">Ses: Açık</button>
</div>

<div id="report-overlay">
<div id="report-bar"><b>Kişisel Performans Raporu</b><span><button id="rep-print">Yazdır</button><button id="rep-copy">Kopyala</button><button id="rep-close">Kapat</button></span></div>
<div id="report-body"></div>
</div>

<script>
window.addEventListener('error',function(e){var b=document.getElementById('err-banner');if(b){b.style.display='block';b.textContent='HATA: '+e.message+' (satır '+e.lineno+')';}});

const APP_VERSION="4.0";
const API_URL="";   // Google Apps Script Web App URL'ni yaz; boşsa sunucuya gönderim yok
const API_TOKEN=""; // Sunucuda doğrulayın

const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const med=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const sd=a=>{if(a.length<2)return null;const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/(a.length-1));};
const fmt=v=>v==null?"–":Math.round(v);
const msSn=ms=>ms+" ms ("+(ms/1000).toFixed(2)+" sn)";
const accOf=a=>a.length?a.filter(x=>x.correct).length/a.length:0;

const COLORS={
red:{hex:'#ff1744',en:'RED',tr:'KIRMIZI',freq:400},
blue:{hex:'#29b6f6',en:'BLUE',tr:'MAVİ',freq:500},
green:{hex:'#00e676',en:'GREEN',tr:'YEŞİL',freq:600},
yellow:{hex:'#ffea00',en:'YELLOW',tr:'SARI',freq:700}};
const KEYS=Object.keys(COLORS);
const SYMBOLS=['▲','●','■','★'];

/* Deneme sayıları: [alıştırma, puanlanan deneme]. q = Hızlı, r = Güvenilir tek seans. Buradan değiştirebilirsiniz. */
const CFG={
gonogo:{q:[2,10],r:[4,50]},
stroop:{q:[2,10],r:[4,60]},
simon:{q:[2,10],r:[4,60]},
flanker:{q:[2,10],r:[4,60]},
antisaccade:{q:[2,10],r:[4,40]},
nback:{q:[0,40],r:[0,80]},
digit_span:{q:[0,10],r:[0,40]},
sprint_ball:{q:[2,10],r:[2,20]},
agility_run:{q:[2,10],r:[2,20]},
complex_agility:{q:[2,10],r:[2,30]},
choice_react:{q:[2,10],r:[2,20]},
visual_search:{q:[2,10],r:[2,20]},
pvt:{q:[2,15],r:[3,40]},
stopsignal:{q:[4,40],r:[6,100]},
taskswitch:{q:[4,40],r:[6,96]},
mot:{q:[1,3],r:[2,8]},
timing:{q:[2,10],r:[3,30]}
};

const moduleSelect=$('module-select'),modeSelect=$('mode-select'),circle=$('target-circle'),gameArea=$('game-area');
const zoneBox=$('antisaccade-touch-zone'),dualButtons=$('dual-buttons');
const btnLeft=$('btn-left-opt'),btnRight=$('btn-right-opt');
const spatialGrid=$('spatial-grid'),memoryGrid=$('memory-grid'),numpadGrid=$('numpad-grid'),trailArea=$('trail-area');
const cv=$('cv'),cx=cv.getContext('2d');
const instructionCard=$('instruction-card');
const startBtn=$('start-btn'),stopBtn=$('stop-btn'),exportBtn=$('export-btn'),muteBtn=$('mute-btn'),reportBtn=$('report-btn');
const statTrials=$('stat-trials'),statTimer=$('stat-timer'),statScore=$('stat-score'),statErrors=$('stat-errors');
const cones=Array.from(document.querySelectorAll('.spatial-btn'));

const S={mod:null,run:0,active:false,waiting:false,rows:[],idx:0,total:10,practiceN:0,rel:false,open:false,t0:0,clockStart:0,resp:null,early:null,athlete:null,sessionId:'',ctx:{},cw:0,ch:0};
const rel=()=>modeSelect.value==='rel';
const openFor=m=>!!(m.open||(rel()&&m.openRel));
function getCfg(mod){const m=MODS[mod],c=CFG[mod];return c?c[rel()?'r':'q']:[m.practice||0,m.total||0];}
function suffix(mod){
const m=MODS[mod];
if(rel()&&m.relNote)return' '+m.relNote;
if(!CFG[mod])return'';
const c=getCfg(mod);
return' ('+(c[0]?c[0]+' alıştırma + ':'')+c[1]+' deneme)';
}
function mkPlan(pn,tot,k){
const part=n=>{const t=Math.round(n*k);return shuffle(Array.from({length:n},(_,i)=>i<t));};
return part(pn).concat(part(tot));
}

const T={
ids:new Set(),
set(fn,ms){const run=S.run;const id=setTimeout(()=>{T.ids.delete(id);if(run===S.run&&S.active)fn();},ms);T.ids.add(id);return id;},
clear(){T.ids.forEach(clearTimeout);T.ids.clear();}
};

let clockInt=null;
function startClock(){stopClock();S.clockStart=performance.now();clockInt=setInterval(()=>{statTimer.textContent=((performance.now()-S.clockStart)/1000).toFixed(2)+' s';},50);}
function stopClock(){if(clockInt)clearInterval(clockInt);clockInt=null;}

let audioCtx=null,muted=false;
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function beep(freq,dur){dur=dur||0.15;if(muted)return;try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(0.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}
function speak(text){if(muted)return;try{if('speechSynthesis' in window){speechSynthesis.cancel();const m=new SpeechSynthesisUtterance(text);m.lang='en-US';speechSynthesis.speak(m);}}catch(e){}}
muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'Ses: Kapalı':'Ses: Açık';if(muted&&'speechSynthesis' in window)speechSynthesis.cancel();});

let wl=null;
async function requestWake(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseWake(){if(wl){wl.release().catch(()=>{});wl=null;}}

/* ---------- Canvas altyapısı (MOT ve Öngörü Zamanlaması) ---------- */
let cvRaf=0,cvLast=0;
function sizeCv(){
const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;

const okRows=r=>r.filter(x=>x.correct);
const errCount=r=>r.filter(x=>!x.correct).length;
const rtsOf=r=>r.filter(x=>x.correct&&x.rt!=null).map(x=>x.rt);
const meanRT=r=>mean(rtsOf(r));
const scRT=div=>r=>(okRows(r).length/r.length)*1000-(meanRT(r)||0)/div-errCount(r)*200/(S.total||10);
const spanOf=r=>Math.max.apply(null,[0].concat(okRows(r).map(x=>parseInt(x.condition.slice(1))||0)));
const exNum=(x,key)=>{const v=parseInt(String(x.extra||'').replace(key+'=',''));return isNaN(v)?null:v;};

function zinv(p){const t=Math.sqrt(-2*Math.log(p<0.5?p:1-p));const x=t-(2.515517+0.802853*t+0.010328*t*t)/(1+1.432788*t+0.189269*t*t+0.001308*t*t*t);return p<0.5?-x:x;}
function nbackStats(r){
const m=r.filter(x=>x.condition==='MATCH'),n=r.filter(x=>x.condition==='NONMATCH');
const hits=m.filter(x=>x.response==='MATCH').length,fa=n.filter(x=>x.response==='MATCH').length;
const H=(hits+0.5)/(m.length+1),F=(fa+0.5)/(n.length+1);
return{hits:hits,nM:m.length,fa:fa,nN:n.length,d:zinv(H)-zinv(F),c:-(zinv(H)+zinv(F))/2};
}

/* ---------- Trail yardımcıları ---------- */
const TRAIL_LEN=20;
function trailRounds(r){
const by={};
r.forEach(x=>{if(/^(R\d+|REAL)$/.test(x.condition)){(by[x.condition]=by[x.condition]||[]).push(x);}});
return Object.keys(by).sort().map(k=>{
const rows=by[k],legs=rows.filter(x=>x.correct);
return{k:k,legs:legs,err:rows.length-legs.length,sec:legs.length>=TRAIL_LEN?legs[legs.length-1].cum/1000:null};
});
}
function trailAvgLegs(rounds){
const done=rounds.filter(x=>x.sec!=null);
if(!done.length)return[];
return done[0].legs.map((l,i)=>({note:l.note,rt:mean(done.map(d=>d.legs[i].rt))}));
}
function trailStats(r){
const rounds=trailRounds(r),done=rounds.filter(x=>x.sec!=null);
return{rounds:rounds,legs:trailAvgLegs(rounds),sec:done.length?mean(done.map(x=>x.sec)):null,err:rounds.reduce((a,x)=>a+x.err,0)};
}
function trailLegsHtml(legs){
if(!legs.length)return'';
const rts=legs.map(l=>l.rt),best=Math.min.apply(null,rts),worst=Math.max.apply(null,rts);
const items=legs.map(l=>{const cls=l.rt===best?'best':l.rt===worst?'worst':'';return'<div class="'+cls+'"><span>'+l.note+'</span><span>'+(l.rt/1000).toFixed(2)+' sn</span></div>';}).join('');
return'<b>Hedefler arası süreler (ort.):</b><div class="legs">'+items+'</div>';
}
function computeScore(){const r=S.rows.filter(x=>!x.practice);if(!r.length)return 0;return Math.max(0,Math.round(MODS[S.mod].score(r)));}
function updateStats(){statErrors.textContent=S.rows.filter(x=>!x.practice&&!x.correct).length;statScore.textContent=computeScore();}
function condEffect(r){
const c=meanRT(r.filter(x=>x.condition==='CONGRUENT')),i=meanRT(r.filter(x=>x.condition==='INCONGRUENT'));
return['Uyumlu ort. RT: '+fmt(c)+' ms','Uyumsuz ort. RT: '+fmt(i)+' ms','Etki (uyumsuz − uyumlu): '+(c!=null&&i!=null?Math.round(i-c)+' ms':'–')];
}

/* Yeni testler için yardımcı hesaplar */
function timingErrs(r){
const errs=r.filter(x=>x.response!=='NONE').map(x=>parseInt(x.response)).filter(v=>isFinite(v));
return{errs:errs,miss:r.filter(x=>x.response==='NONE').length};
}
function stopStats(r){
const go=r.filter(x=>x.condition==='GO'),st=r.filter(x=>x.condition==='STOP');
const fails=st.filter(x=>!x.correct),pr=st.length?fails.length/st.length:0;
const ssds=st.map(x=>exNum(x,'SSD')).filter(v=>v!=null);
const mSSD=mean(ssds);
const goVals=go.map(x=>x.rt!=null?x.rt:1500).sort((a,b)=>a-b);
const ssrt=(mSSD!=null&&goVals.length)?goVals[Math.max(0,Math.ceil(pr*goVals.length)-1)]-mSSD:null;
return{go:go,st:st,fails:fails,pr:pr,mSSD:mSSD,ssrt:ssrt};
}

const RT_FORMULA="Puan = Doğruluk×1000 − Ort.RT(ms)/2 − Hata×(200/Deneme sayısı) (alıştırma hariç)";
const FIELD_FORMULA="Puan = Doğruluk×1000 − Ort.RT(ms)/10 − Hata×(200/Deneme sayısı) (alıştırma hariç)";

/* ---------- Trail Making ---------- */
function trailModule(kind){
const real=kind==='A'?Array.from({length:TRAIL_LEN},(_,i)=>String(i+1)):['1','A','2','B','3','C','4','D','5','E','6','F','7','G','8','H','9','I','10','J'];
const demo1=kind==='A'?['1','2','3','4']:['1','A','2','B'];
const demo2=kind==='A'?['1','2','3','4','5']:['1','A','2','B','3'];
return{
title:kind==='A'?"6. Trail Making Test A":"7. Trail Making Test B",
text:kind==='A'?"1'den 20'ye kadar sayılara sırasıyla dokunun. Önce 2 kısa alıştırma yapılır.":"1-A-2-B-3-C... şeklinde sayı ve harfe dönüşümlü dokunun. Önce 2 kısa alıştırma yapılır.",
relNote:"Güvenilir modda 3 tur yapılır: 1. tur alıştırma sayılır, 2. ve 3. tur puanlanır.",
eval:kind==='A'?"Ölçülen Yetenek: Görsel Tarama & Motor Hız.":"Ölçülen Yetenek: Görev Değiştirme / Bilişsel Esneklik.",
formula:"Puan = 1000 − Süre(sn)×8 − Hata×30 (puanlanan turların ortalama süresi)",open:true,practice:0,
score:r=>{const s=trailStats(r);return s.sec==null?0:1000-s.sec*8-s.err*30;},
extra:r=>{
const s=trailStats(r);
const out=['Tamamlama süresi (ort.): '+(s.sec==null?'–':s.sec.toFixed(1)+' sn'),'Sıra hatası: '+s.err];
const done=s.rounds.filter(x=>x.sec!=null);
if(done.length>1)out.push('Tur süreleri: '+done.map(x=>x.sec.toFixed(1)+' sn').join(' · '));
if(s.legs.length){
const rts=s.legs.map(l=>l.rt);
const bi=rts.indexOf(Math.min.apply(null,rts)),wi=rts.indexOf(Math.max.apply(null,rts));
out.push('<span style="color:#00e676">En hızlı aralık: '+s.legs[bi].note+' → '+(rts[bi]/1000).toFixed(2)+' sn</span>',
'<span style="color:#ff5252">En yavaş aralık: '+s.legs[wi].note+' → '+(rts[wi]/1000).toFixed(2)+' sn</span>',
'Ortalama aralık: '+(mean(rts)/1000).toFixed(2)+' sn',
trailLegsHtml(s.legs));
}
return out;
},
setup(){S.ctx.stage='P1';S.ctx.rounds=S.rel?3:1;trailArea.style.display='block';},
trial(){
const st=S.ctx.stage,isReal=st.charAt(0)==='R';
const rn=isReal?parseInt(st.slice(1)):0;
const seq=st==='P1'?demo1:st==='P2'?demo2:real;
const pr=!isReal||(S.rel&&rn===1);
S.idx=isReal?3:(st==='P1'?1:2);
statTrials.textContent=isReal?(S.ctx.rounds>1?('Tur '+rn+'/'+S.ctx.rounds+(pr?' (alıştırma)':'')):'GERÇEK TEST'):('Pratik '+S.idx+'/2');
trailArea.innerHTML='';
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
trailArea.appendChild(svg);
const W=trailArea.clientWidth,H=trailArea.clientHeight,sz=46,minD=58,pts=[];
seq.forEach(()=>{
let p,tries=0;
do{p={x:rnd(Math.max(1,W-sz)),y:rnd(Math.max(1,H-sz))};tries++;}
while(tries<600&&pts.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<minD));
pts.push(p);
});
S.ctx.next=0;S.ctx.prev=null;S.ctx.lastCum=0;
seq.forEach((val,i)=>{
const node=document.createElement('div');
node.className='trail-node';node.textContent=val;
node.style.left=pts[i].x+'px';node.style.top=pts[i].y+'px';
node.addEventListener('pointerdown',ev=>{
ev.preventDefault();
if(!S.active||!S.waiting||node.classList.contains('done'))return;
const cum=Math.round(performance.now()-S.t0);
if(val===seq[S.ctx.next]){
const from=S.ctx.next===0?'Başla':seq[S.ctx.next-1];
const leg=cum-S.ctx.lastCum;
S.ctx.lastCum=cum;
beep(400+S.ctx.next*30,0.1);
node.classList.add('done');
const c={x:pts[i].x+sz/2,y:pts[i].y+sz/2};
if(S.ctx.prev){
const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
ln.setAttribute('x1',S.ctx.prev.x);ln.setAttribute('y1',S.ctx.prev.y);
ln.setAttribute('x2',c.x);ln.setAttribute('y2',c.y);
ln.setAttribute('stroke','#00e676');ln.setAttribute('stroke-width','3');
svg.appendChild(ln);
}
S.ctx.prev=c;S.ctx.next++;
record({correct:true,rt:leg,cum:cum,note:from+'→'+val,cond:st,resp:String(val),practice:pr});
if(S.ctx.next>=seq.length){
S.waiting=false;fb(true);
if(isReal&&rn>=S.ctx.rounds){T.set(finishTest,400);}
else{S.ctx.stage=st==='P1'?'P2':st==='P2'?'R1':'R'+(rn+1);T.set(MODS[S.mod].trial,1200);}
}
}else{
record({correct:false,rt:null,cum:cum,note:'Sıra Hatası ('+val+', beklenen '+seq[S.ctx.next]+')',cond:st,resp:String(val),practice:pr});
fb(false);beep(150,0.2);
}
});
trailArea.appendChild(node);
});
startClock();
S.t0=performance.now();S.waiting=true;
}
};
}

trial(){

title:"19. Çoklu Nesne Takibi (MOT)",text:"8 top görünür; bazıları SARI işaretlenir. Sonra hepsi aynı renge döner ve 5 sn hareket eder. Hareket durunca hedef olduğunu düşündüğünüz topların hepsine dokunun. Hedef sayısı başarınıza göre artar (2–5).",
eval:"Ölçülen Yetenek: Dinamik görsel dikkat, çoklu hedef takibi (takım sporlarında ortam tarama).",formula:"Puan = Ort. doğru izlenen hedef × 200 (0–1000)",
score:r=>Math.min(1000,mean(r.map(x=>parseInt(x.response)||0))*200),
extra:r=>{
const h=r.map(x=>parseInt(x.response)||0);
return['Mükemmel deneme: '+r.filter(x=>x.correct).length+'/'+r.length,'Ort. doğru hedef: '+(mean(h)==null?'–':mean(h).toFixed(2))];
},
setup(){cvShow();S.ctx.nT=3;S.ctx.frame=null;},
trial(){
const c=S.ctx,W=S.cw,H=S.ch,n=8,nT=c.nT;
const rad=Math.max(12,Math.min(W,H)/20),sp=Math.min(W,H)*0.4;
const balls=[];
for(let i=0;i<n;i++){
let p,tries=0;
do{p={x:rad+Math.random()*Math.max(1,W-2*rad),y:rad+Math.random()*Math.max(1,H-2*rad)};tries++;}
while(tries<300&&balls.some(b=>Math.hypot(b.x-p.x,b.y-p.y)<rad*2.6));
const a=Math.random()*Math.PI*2;
balls.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:i<nT,s:false});
}
c.phase='cue';c.sel=0;
const ball=(b,fill,ring)=>{
cx.beginPath();cx.arc(b.x,b.y,rad,0,Math.PI*2);cx.fillStyle=fill;cx.fill();
if(ring){cx.lineWidth=4;cx.strokeStyle=ring;cx.stroke();}
};
c.frame=dt=>{
const W2=S.cw,H2=S.ch;
if(c.phase==='move'){
balls.forEach(b=>{
b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.x<rad){b.x=rad;b.vx=Math.abs(b.vx);}
if(b.x>W2-rad){b.x=W2-rad;b.vx=-Math.abs(b.vx);}
if(b.y<rad){b.y=rad;b.vy=Math.abs(b.vy);}
if(b.y>H2-rad){b.y=H2-rad;b.vy=-Math.abs(b.vy);}
});
for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
if(d<rad*2&&d>0){
const nx=dx/d,ny=dy/d,rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
if(rv<0){a.vx-=rv*nx;a.vy-=rv*ny;b.vx+=rv*nx;b.vy+=rv*ny;}
const ov=rad*2-d;a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2;
}
}
}
cx.clearRect(0,0,W2,H2);
balls.forEach(b=>{
if(c.phase==='cue')ball(b,b.t?'#ffea00':'#4fc3f7',null);
else if(c.phase==='move')ball(b,'#4fc3f7',null);
else if(c.phase==='pick')ball(b,b.s?'#90caf9':'#4fc3f7',b.s?'#ffffff':null);
else{
if(b.t&&b.s)ball(b,'#00e676',null);
else if(!b.t&&b.s)ball(b,'#ff1744',null);
else if(b.t)ball(b,'#4fc3f7','#ffea00');
else ball(b,'#4fc3f7',null);
}
});
cx.fillStyle='#bbb';cx.font='14px sans-serif';cx.textAlign='center';
const msg=c.phase==='cue'?'Sarı topları aklınızda tutun':c.phase==='move'?'Hedefleri takip edin...':c.phase==='pick'?('Hedefleri seçin ('+c.sel+'/'+nT+')'):'Sonuç';
cx.fillText(msg,W2/2,22);
};
const finalize=ev=>{
if(!S.waiting)return;
const hits=balls.filter(b=>b.t&&b.s).length,perfect=hits===nT;
c.phase='reveal';
if(!isPractice()){
if(perfect)c.nT=Math.min(5,nT+1);
else if(hits<=nT-2)c.nT=Math.max(2,nT-1);
}
endTrial({correct:perfect,note:hits+'/'+nT+' hedef',rt:rtFrom(ev),cond:'T'+nT,resp:String(hits),delay:1800});
};
const pickFn=(src,ev)=>{
if(!ev)return;
const rc=cv.getBoundingClientRect(),x=ev.clientX-rc.left,y=ev.clientY-rc.top;
let best=null,bd=1e9;
balls.forEach(b=>{const d=Math.hypot(b.x-x,b.y-y);if(d<bd){bd=d;best=b;}});
if(!best||bd>rad*2)return;
best.s=!best.s;c.sel+=best.s?1:-1;beep(500,0.05);
if(c.sel>=nT)finalize(ev);
};
T.set(()=>{c.phase='move';},2000);
T.set(()=>{
c.phase='pick';S.t0=performance.now();S.resp=pickFn;S.waiting=true;
T.set(()=>finalize(null),20000);
},7000);
}
},
timing:{
title:"20. Öngörü Zamanlaması (Anticipation)",text:"Nokta soldan sağa gider, ortadaki perdenin arkasında kaybolur ve görünmeden devam eder. Noktanın sağdaki turkuaz çizgiye ulaştığı ANDA ekrana dokunun. Üç farklı hız karışık gelir.",
eval:"Ölçülen Yetenek: Hareketli hedefi öngörme ve zamanlama (top yakalama, vuruş, pas kesme). Hata ms olarak ölçülür; + geç, − erken.",formula:"Puan = 1000 − Ort. mutlak hata(ms)×2 (cevapsız deneme = 600 ms hata)",
score:r=>Math.max(0,1000-mean(r.map(x=>x.rt==null?600:x.rt))*2),
extra:r=>{
const t=timingErrs(r);
if(!t.errs.length)return['Geçerli dokunuş yok.'];
return['Ort. mutlak hata: '+Math.round(mean(t.errs.map(Math.abs)))+' ms','Ort. yönlü hata: '+Math.round(mean(t.errs))+' ms (+geç / −erken)','İsabet (±100 ms): '+t.errs.filter(e=>Math.abs(e)<=100).length+'/'+r.length];
},
setup(){
cvShow();S.ctx.frame=null;
const n=S.practiceN+S.total;let a=[];
while(a.length<n)a=a.concat(shuffle([1,2,3]));
S.ctx.sp=a.slice(0,n);
},
trial(){
const c=S.ctx,lvl=c.sp[S.idx-1],W=S.cw,H=S.ch;
const x0=W*0.08,xl=W*0.85,xo=W*0.42,y=H*0.45;
const v=W*[0,0.35,0.5,0.7][lvl];
const arrive=(xl-x0)/v*1000;
c.phase='wait';c.start=0;c.tt=0;c.msg='';
c.frame=()=>{
cx.clearRect(0,0,S.cw,S.ch);
cx.strokeStyle='#333';cx.lineWidth=2;cx.beginPath();cx.moveTo(x0,y);cx.lineTo(W*0.95,y);cx.stroke();
cx.fillStyle='#1b1b1b';cx.fillRect(xo,y-40,xl-xo-8,80);
cx.strokeStyle='#444';cx.lineWidth=1;cx.strokeRect(xo,y-40,xl-xo-8,80);
cx.strokeStyle='#00e5ff';cx.lineWidth=4;cx.beginPath();cx.moveTo(xl,y-50);cx.lineTo(xl,y+50);cx.stroke();
const now=performance.now();
let x=x0;
if(c.phase!=='wait')x=x0+v*(now-c.start)/1000;
const hide=c.phase==='run'&&x>=xo;
if(!hide&&x<W+20){cx.beginPath();cx.arc(x,y,12,0,Math.PI*2);cx.fillStyle='#ffea00';cx.fill();}
if(c.phase==='reveal'){
const xt=x0+v*(c.tt-c.start)/1000;
cx.beginPath();cx.arc(xt,y,16,0,Math.PI*2);cx.lineWidth=3;cx.strokeStyle=c.good?'#00e676':'#ff5252';cx.stroke();
}
cx.fillStyle='#bbb';cx.font='14px sans-serif';cx.textAlign='center';
cx.fillText(c.phase==='wait'?'Hazır...':c.phase==='run'?'Nokta çizgiye ulaşınca dokunun':c.msg,S.cw/2,24);
};
T.set(()=>{
c.start=performance.now();c.phase='run';S.t0=c.start;
S.resp=(src,ev)=>{
const now=performance.now();
const tt=(ev&&ev.timeStamp>0&&ev.timeStamp<=now+5)?ev.timeStamp:now;
const err=Math.round(tt-(c.start+arrive)),good=Math.abs(err)<=100;
c.tt=tt;c.phase='reveal';c.good=good;
c.msg=(err>0?'Geç ':'Erken ')+Math.abs(err)+' ms';
endTrial({correct:good,note:c.msg,rt:Math.abs(err),cond:'V'+lvl,resp:String(err),delay:1400});
};
S.waiting=true;
T.set(()=>{
c.tt=performance.now();c.phase='reveal';c.good=false;c.msg='Dokunuş yok';
endTrial({correct:false,note:'Cevapsız',cond:'V'+lvl,resp:'NONE',delay:1400});
},arrive+1500);
},600+rnd(900));
}
}
};

/* ---------- Analiz ve yorum motoru ---------- */
const AC={good:'#00e676',warn:'#ff5252',info:'#ffca28'};
function rtBlock(r,M,C,A){
const n=r.length,ok=okRows(r),rts=rtsOf(r),acc=n?ok.length/n:0;
M.push(['Puanlanan deneme',n],['Doğruluk','%'+Math.round(acc*100)]);
if(acc>=0.95)C('good','Doğruluk çok yüksek (%'+Math.round(acc*100)+'): hız-doğruluk dengesi güvenli tarafta.');
else if(acc>=0.85)C('info','Doğruluk iyi (%'+Math.round(acc*100)+'), '+(n-ok.length)+' hata var.');
else C('warn','Doğruluk düşük (%'+Math.round(acc*100)+'): hata sayısı yüksek; biraz yavaşlayıp doğruluğa odaklanmak gerekebilir.');
if(!rts.length){C('warn','Geçerli tepki süresi yok.');return null;}
const m=mean(rts),md=med(rts),s=sd(rts),cv=s!=null?s/m:null;
M.push(['Ortalama / medyan RT',Math.round(m)+' / '+Math.round(md)+' ms'],['En iyi / en kötü',Math.min.apply(null,rts)+' / '+Math.max.apply(null,rts)+' ms'],['Std. sapma',s==null?'–':Math.round(s)+' ms'],['Değişkenlik (CV)',cv==null?'–':'%'+Math.round(cv*100)]);
A.prim={label:'Medyan RT',val:md,unit:'ms',low:true};
A.cv=cv;
if(cv!=null){
if(cv<0.2)C('good','Tepki süreleri tutarlı (CV %'+Math.round(cv*100)+'): dikkat seans boyunca istikrarlı.');
else if(cv<=0.35)C('info','Tutarlılık orta düzeyde (CV %'+Math.round(cv*100)+').');
else C('warn','Tepki süreleri çok değişken (CV %'+Math.round(cv*100)+'): dikkat dalgalanmaları veya anlık duraksamalar olabilir.');
}
if((m-md)/md>0.1)C('info','Ortalama medyandan %'+Math.round((m-md)/md*100)+' yüksek: birkaç çok yavaş deneme ortalamayı şişiriyor. Temsil değeri olarak medyan daha güvenilir.');
const fast=rts.filter(x=>x<150).length;
if(fast>=2)C('warn',fast+' denemede tepki süresi 150 ms altında: bu süreler çoğunlukla tahmin/erken basma işaretidir; seans geçerliliği için sonuçlar dikkatle yorumlanmalı.');
if(rts.length>=12){
const h=Math.floor(rts.length/2),a1=mean(rts.slice(0,h)),a2=mean(rts.slice(h)),d=(a2-a1)/a1;
M.push(['Seans ilk yarı / ikinci yarı',Math.round(a1)+' / '+Math.round(a2)+' ms']);
if(d>0.1)C('warn','Seans ilerledikçe %'+Math.round(d*100)+' yavaşlama: yorgunluk veya dikkat düşmesi olabilir.');
else if(d<-0.1)C('info','Seans ilerledikçe %'+Math.round(-d*100)+' hızlanma: ısınma/öğrenme etkisi. İlk denemeler alışma sürecinden etkilenmiş olabilir.');
else C('good','Seans boyunca hız stabil (ilk ve ikinci yarı arası fark %10 altında).');
}
const er=r.filter(x=>!x.correct&&x.rt!=null).map(x=>x.rt);
if(er.length>=3&&mean(er)<m*0.9)C('warn','Hatalı denemeler doğrulardan daha hızlı: aceleci (düşünmeden) tepki eğilimi.');
return{m:m,md:md,s:s,cv:cv,rts:rts};
}
function condBlock(r,M,C,A,name){
const cg=r.filter(x=>x.condition==='CONGRUENT'),ig=r.filter(x=>x.condition==='INCONGRUENT');
const cr=rtsOf(cg),ir=rtsOf(ig),ca=cg.length?okRows(cg).length/cg.length:0,ia=ig.length?okRows(ig).length/ig.length:0;
M.push(['Uyumlu: deneme / doğruluk',cg.length+' / %'+Math.round(ca*100)],['Uyumsuz: deneme / doğruluk',ig.length+' / %'+Math.round(ia*100)],
['Uyumlu ort. / medyan RT',cr.length?Math.round(mean(cr))+' / '+Math.round(med(cr))+' ms':'–'],
['Uyumsuz ort. / medyan RT',ir.length?Math.round(mean(ir))+' / '+Math.round(med(ir))+' ms':'–']);
if(Math.min(cr.length,ir.length)<8)C('info',"Koşul başına geçerli deneme 8'in altında: "+name+' etkisi kararsız olabilir (hedef: her koşulda 20–30).');
if(cr.length&&ir.length){
const eff=mean(ir)-mean(cr),rl=eff/mean(cr);
A.eff=rl;
M.push([name+' etkisi (ort.)',Math.round(eff)+' ms (%'+Math.round(rl*100)+')'],[name+' etkisi (medyan)',Math.round(med(ir)-med(cr))+' ms']);
if(eff<=0)C('info',name+' etkisi görülmedi (uyumsuz denemeler uyumludan yavaş değil). Az deneme, strateji veya acele nedeniyle olabilir.');
else if(rl<0.1)C('good','Çatışma maliyeti küçük (%'+Math.round(rl*100)+'): çeldiriciyi baskılama güçlü.');
else if(rl<0.25)C('info','Çatışma maliyeti orta düzeyde (%'+Math.round(rl*100)+', '+Math.round(eff)+' ms).');
else C('warn','Çatışma maliyeti belirgin (%'+Math.round(rl*100)+', '+Math.round(eff)+' ms): çelişkili uyaranı çözmek ciddi zaman alıyor.');
if(name!=='Stroop')C('info','Not: Simon ve Flanker etkileri literatürde genellikle onlarca ms düzeyindedir; dokunmatik ekran ölçümünde daha büyük çıkabilir.');
if(ca-ia>=0.15)C('warn','Uyumsuz denemelerde doğruluk belirgin düşük (%'+Math.round(ia*100)+' vs %'+Math.round(ca*100)+'): çatışma yalnızca yavaşlatmıyor, hata da üretiyor.');
}
}
function ngAna(lab1,lab2){return function(r,M,C,A){
rtBlock(r,M,C,A);
const go=r.filter(x=>x.condition==='GO'),ng=r.filter(x=>x.condition==='NOGO');
const com=ng.filter(x=>!x.correct).length,om=go.filter(x=>!x.correct).length;
const cr=ng.length?com/ng.length:0,orr=go.length?om/go.length:0;
M.push([lab1,com+'/'+ng.length+' (%'+Math.round(cr*100)+')'],[lab2,om+'/'+go.length+' (%'+Math.round(orr*100)+')']);
if(ng.length<10)C('info',"No-Go deneme sayısı 10'un altında: komisyon oranı kararsız (hedef: en az 10–15).");
if(cr>0.2)C('warn','Komisyon hatası yüksek (%'+Math.round(cr*100)+'): dur komutunda hareketi baskılamakta zorlanma.');
else if(cr>0.1)C('info','Komisyon hatası orta (%'+Math.round(cr*100)+').');
else C('good','Komisyon hatası düşük (%'+Math.round(cr*100)+'): dur komutunda baskılama iyi.');
if(orr>0.1)C('warn','Go komutunu kaçırma oranı %'+Math.round(orr*100)+': dikkat kaybı veya geç tepki.');
};}
function byCond(r,M,C,label){
const g={};
r.forEach(x=>{if(x.correct&&x.rt!=null){(g[x.condition]=g[x.condition]||[]).push(x.rt);}});
const ks=Object.keys(g).filter(k=>g[k].length>=2).map(k=>({k:k,md:med(g[k]),n:g[k].length})).sort((a,b)=>a.md-b.md);
if(ks.length<2)return;
M.push([label+' bazında medyan RT',ks.map(x=>x.k+': '+Math.round(x.md)+' ms (n='+x.n+')').join(' · ')]);
const f=ks[0],s=ks[ks.length-1];
if(f.n>=3&&s.n>=3&&s.md>f.md*1.2)C('info','En yavaş '+label.toLowerCase()+' '+s.k+' ('+Math.round(s.md)+' ms), en hızlı '+f.k+' ('+Math.round(f.md)+' ms): %'+Math.round((s.md/f.md-1)*100)+' fark. Bu koşula ek tekrar düşünülebilir.');
}
const fieldNote=C=>C('info','Süre komut–dokunuş toplamıdır (depar dahil). Temsil değeri olarak medyan ve en iyi süre birlikte okunmalı.');
function choiceAna(label){return function(r,M,C,A){
rtBlock(r,M,C,A);
const w=r.filter(x=>!x.correct&&x.response!=='NONE').length,miss=r.filter(x=>x.response==='NONE').length;
M.push(['Yanlış seçim',w],['Cevapsız',miss]);
if(w>=2)C('warn',w+' yanlış seçim: komutu işleme veya hedefi ayırt etmede hata.');
if(miss>=2)C('warn',miss+' cevapsız deneme: süre aşımı veya dikkat kaybı.');
byCond(r,M,C,label);fieldNote(C);
};}
function trailAna(kind){return function(r,M,C,A){
const rd=trailRounds(r),done=rd.filter(x=>x.sec!=null);
M.push(['Tamamlanan tur (puanlanan)',done.length+'/'+rd.length]);
if(!done.length){C('warn','Tamamlanmış puanlanan tur yok.');return;}
const secs=done.map(x=>x.sec),m=mean(secs);
M.push(['Tur süreleri',secs.map(x=>x.toFixed(1)+' sn').join(' · ')],['Ortalama tur süresi',m.toFixed(1)+' sn'],['En iyi tur',Math.min.apply(null,secs).toFixed(1)+' sn']);
A.prim={label:'Ort. tur süresi',val:m,unit:'sn',low:true};
const err=rd.reduce((a,x)=>a+x.err,0);
M.push(['Sıra hatası',err]);
if(err===0)C('good','Hatasız tamamlandı.');
else C(err>=3?'warn':'info',err+' sıra hatası: acele veya görsel tarama sorunu olabilir.');
if(done.length>=2){
const ch=(secs[secs.length-1]-secs[0])/secs[0];
if(ch<-0.08)C('info','Son tur ilk puanlanan turdan %'+Math.round(-ch*100)+' hızlı: öğrenme/ısınma etkisi.');
else if(ch>0.08)C('warn','Son tur ilk puanlanan turdan %'+Math.round(ch*100)+' yavaş: yorgunluk veya motivasyon düşüşü olabilir.');
else C('good','Turlar arası süre tutarlı (fark %8 altında).');
}
const legs=trailAvgLegs(rd);
if(legs.length){
const lr=legs.map(l=>l.rt),lm=mean(lr),ls=sd(lr);
const sorted=legs.slice().sort((a,b)=>b.rt-a.rt);
M.push(['Ortalama aralık',(lm/1000).toFixed(2)+' sn'],['En yavaş 3 aralık',sorted.slice(0,3).map(l=>l.note+' '+(l.rt/1000).toFixed(2)+' sn').join(' · ')],['En hızlı aralık',sorted[sorted.length-1].note+' '+(sorted[sorted.length-1].rt/1000).toFixed(2)+' sn']);
if(ls!=null){
const pauses=legs.filter(l=>l.rt>lm+2*ls);
if(pauses.length)C('info','Belirgin duraksama (ort.+2 SS üstü): '+pauses.map(l=>l.note).join(', ')+'. Hedef bulma/görsel tarama zorlanmış olabilir.');
}
const h1=mean(lr.slice(0,10)),h2=mean(lr.slice(10)),d=(h2-h1)/h1;
M.push(['Aralıklar ilk yarı / ikinci yarı',(h1/1000).toFixed(2)+' / '+(h2/1000).toFixed(2)+' sn']);
if(d>0.15)C('info','İkinci yarıdaki aralıklar %'+Math.round(d*100)+' yavaş: yorgunluk ya da hedeflerin dağınıklaşması.');
if(kind==='B'){
const lt=legs.filter(l=>/→[A-J]$/.test(l.note)).map(l=>l.rt),nm=legs.filter(l=>/→\d+$/.test(l.note)).map(l=>l.rt);
if(lt.length&&nm.length){
const a=mean(lt),b=mean(nm);
M.push(['Harfe / sayıya geçiş ort.',(a/1000).toFixed(2)+' / '+(b/1000).toFixed(2)+' sn']);
if(a>b*1.1)C('info','Harfe geçişler sayıya geçişlerden %'+Math.round((a/b-1)*100)+' yavaş: harf dizisini hatırlama/bulma yükü.');
else if(b>a*1.1)C('info','Sayıya geçişler harfe geçişlerden %'+Math.round((b/a-1)*100)+' yavaş: sayı dizisini bulma yükü.');
else C('good','Harf ve sayı geçişleri dengeli.');
}
}
}
};}
const ANA={};
ANA.gonogo=ngAna("Komisyon hatası (DUR'da dokunma)","Omisyon (GO'da dokunmama)");
ANA.complex_agility=function(r,M,C,A){ngAna('Hatalı depar (eşleşmezken koşma)','Cevapsız/yanlış (eşleşmede)')(r,M,C,A);fieldNote(C);};
ANA.stroop=function(r,M,C,A){rtBlock(r,M,C,A);condBlock(r,M,C,A,'Stroop');};
ANA.simon=function(r,M,C,A){rtBlock(r,M,C,A);condBlock(r,M,C,A,'Simon');};
ANA.flanker=function(r,M,C,A){rtBlock(r,M,C,A);condBlock(r,M,C,A,'Flanker');};
ANA.antisaccade=function(r,M,C,A){
rtBlock(r,M,C,A);
const L=r.filter(x=>x.condition==='TARGET_LEFT'),R=r.filter(x=>x.condition==='TARGET_RIGHT');
const aL=L.length?okRows(L).length/L.length:0,aR=R.length?okRows(R).length/R.length:0;
const viol=r.filter(x=>!x.correct&&x.response!=='NONE').length,miss=r.filter(x=>x.response==='NONE').length;
M.push(['Işık solda: doğruluk','%'+Math.round(aL*100)+' (n='+L.length+')'],['Işık sağda: doğruluk','%'+Math.round(aR*100)+' (n='+R.length+')'],['Refleks ihlali (ışık tarafına dokunma)',viol],['Cevapsız',miss]);
const vr=r.length?viol/r.length:0;
if(vr>0.2)C('warn','Refleks ihlali yüksek (%'+Math.round(vr*100)+'): ışığa yönelme tepkisini baskılamakta zorlanma.');
else if(vr<=0.1)C('good','Refleks ihlali düşük (%'+Math.round(vr*100)+'): ışığa yönelme tepkisi iyi baskılanıyor.');
else C('info','Refleks ihlali orta düzeyde (%'+Math.round(vr*100)+').');
if(Math.min(L.length,R.length)>=6&&Math.abs(aL-aR)>=0.2)C('info','Yan asimetrisi: ışık '+(aL<aR?'solda':'sağda')+' iken doğruluk daha düşük (%'+Math.round(Math.min(aL,aR)*100)+' vs %'+Math.round(Math.max(aL,aR)*100)+').');
if(miss>=2)C('warn',miss+' cevapsız deneme: kısa ışığı kaçırma veya geç tepki.');
};
ANA.trailA=trailAna('A');
ANA.trailB=trailAna('B');
ANA.memory=function(r,M,C,A){
const sp=spanOf(r);
A.prim={label:'Corsi span',val:sp,unit:'',low:false};
const lv={};
r.forEach(x=>{const l=parseInt(x.condition.slice(1));if(l){lv[l]=lv[l]||{p:0,t:0};lv[l].t++;if(x.correct)lv[l].p++;}});
const ks=Object.keys(lv).map(Number).sort((a,b)=>a-b);
M.push(['Corsi span (en yüksek doğru seviye)',sp],['Seviye bazında başarı',ks.map(k=>k+': '+lv[k].p+'/'+lv[k].t).join(' · ')]);
const tp=r.filter(x=>x.correct&&x.rt!=null).map(x=>x.rt/(parseInt(x.condition.slice(1))||1));
if(tp.length)M.push(['Ort. giriş hızı (doğru dizi)',Math.round(mean(tp))+' ms/kare']);
if(sp===0)C('warn','Hiç doğru dizi tamamlanamadı.');
else C('info','Span '+sp+'. Yetişkin literatüründe Corsi span değerleri sık olarak yaklaşık 5–7 aralığında raporlanır; ancak ızgara düzeni ve sunum hızı klasik Corsi tahtasından farklı olduğu için doğrudan norm karşılaştırması yapmayın.');
const unstable=ks.filter(k=>lv[k].t>=2&&lv[k].p===1);
if(unstable.length)C('info','Seviye '+unstable.join(', ')+': 2 haktan yalnızca 1 başarı. Span sınırı bu seviyelerde, performans dalgalanıyor.');
const last=r[r.length-1];
if(last&&!last.correct)C('info','Test '+last.condition.slice(1)+'. seviyede sona erdi.');
};
ANA.nback=function(r,M,C,A){
const s=nbackStats(r),hr=s.nM?s.hits/s.nM:0,fr=s.nN?s.fa/s.nN:0;
const N=r.length&&r[0].extra?r[0].extra.replace('N=',''):'?';
const hitRT=rtsOf(r.filter(x=>x.condition==='MATCH')),om=r.filter(x=>x.response==='NONE').length;
A.prim={label:"d′",val:s.d,unit:'',low:false};
M.push(['N seviyesi',N],['İsabet (hit)',s.hits+'/'+s.nM+' (%'+Math.round(hr*100)+')'],['Kaçırma (miss)',(s.nM-s.hits)+'/'+s.nM],['Yanlış alarm',s.fa+'/'+s.nN+' (%'+Math.round(fr*100)+')'],["d′ (ayırt etme)",s.d.toFixed(2)],['Karar eşiği (c)',s.c.toFixed(2)],['Cevapsız',om]);
if(hitRT.length)M.push(['İsabetlerde ort. RT',Math.round(mean(hitRT))+' ms']);
if(s.nM<10)C('info',"Hedef (eşleşme) sayısı 10'un altında: d′ kararsız (hedef: 20+).");
if(s.d<0.5)C('warn',"d′ düşük ("+s.d.toFixed(2)+"): eşleşme ile eşleşmeme ayrımı şansa yakın. N seviyesi bu kişi için zor olabilir.");
else if(s.d<1.5)C('info',"d′ orta ("+s.d.toFixed(2)+"): ayırt etme var ama güvenilir değil (kabaca bir eşik değerlendirmesidir).");
else C('good',"d′ yüksek ("+s.d.toFixed(2)+"): bellek güncelleme iyi çalışıyor.");
if(s.c<-0.5)C('info','Karar eğilimi "EŞLEŞTİ" yönünde (c='+s.c.toFixed(2)+'): şüphede eşleşme deme eğilimi, yanlış alarm riski.');
else if(s.c>0.5)C('info','Karar eğilimi "FARKLI" yönünde (c='+s.c.toFixed(2)+'): şüphede temkinli, eşleşmeleri kaçırma riski.');
if(om>=3)C('warn',om+' denemede cevap verilmedi: dikkat kaybı veya geç karar.');
};
ANA.digit_span=function(r,M,C,A){
const sp=spanOf(r);
A.prim={label:'Digit span',val:sp,unit:'',low:false};
const lv={};

ANA.pvt=function(r,M,C,A){
const st=rtBlock(r,M,C,A);
const fs=Math.max.apply(null,[0].concat(r.map(x=>exNum(x,'FS')||0)));
const miss=r.filter(x=>x.response==='NONE').length;
M.push(['Erken basma (yanlış başlangıç)',fs],['Yanıtsız (>3 sn)',miss]);
if(st){
const s=st.rts.slice().sort((a,b)=>a-b),k=Math.max(1,Math.round(s.length*0.1));
const fast=mean(s.slice(0,k)),slow=mean(s.slice(-k)),lapses=s.filter(x=>x>500).length,lr=lapses/s.length;
M.push(['Lapse (>500 ms)',lapses+'/'+s.length+' (%'+Math.round(lr*100)+')'],['En hızlı %10 / en yavaş %10 ort.',Math.round(fast)+' / '+Math.round(slow)+' ms']);
if(lapses===0)C('good','Hiç lapse (500 ms üstü tepki) yok: uyanıklık seans boyunca korunmuş.');
else if(lr>0.1)C('warn','Lapse oranı yüksek (%'+Math.round(lr*100)+'): uyanıklık düşüşü, yorgunluk veya uykusuzluk göstergesi olabilir.');
else C('info',lapses+' lapse (%'+Math.round(lr*100)+'): arada kısa dikkat kayıpları var.');
if(slow>2*st.md)C('info','En yavaş %10 denemelerin ortalaması medyanın 2 katından fazla: performansın zayıf kuyruğu belirgin (PVT yorgunluk duyarlılığının ana göstergesi).');
}
if(fs>=3)C('warn',fs+' erken basma: uyaranı beklemeden tepki verme eğilimi (dürtüsellik).');
else if(fs===0)C('good','Erken basma yok: bekleme kontrolü iyi.');
if(miss>=1)C('warn',miss+' denemede 3 sn içinde tepki yok: ciddi dikkat kaybı.');
};
ANA.stopsignal=function(r,M,C,A){
const s=stopStats(r);
rtBlock(s.go,M,C,A);
M.forEach(m=>{m[0]='Go – '+m[0];});
const ok=s.st.length-s.fails.length,frt=s.fails.map(x=>x.rt).filter(v=>v!=null),gm=mean(rtsOf(s.go));
const om=s.go.filter(x=>x.response==='NONE').length;
M.push(['Durdurma denemesi',s.st.length],['Durdurma başarısı',ok+'/'+s.st.length+' (%'+Math.round((1-s.pr)*100)+')'],['Ort. durdurma gecikmesi (SSD)',s.mSSD==null?'–':Math.round(s.mSSD)+' ms'],['SSRT (integrasyon yöntemi)',s.ssrt==null?'–':Math.round(s.ssrt)+' ms'],['Başarısız durdurmada ort. RT',frt.length?Math.round(mean(frt))+' ms':'–'],['Go cevapsız (omisyon)',om]);

if(s.st.length<20)C('info',"Durdurma denemesi 20'nin altında: SSRT kararsız (hedef: 40+).");
if(s.st.length>=8){
if(s.pr>=0.25&&s.pr<=0.75)C('good','Durdurma başarısı %'+Math.round((1-s.pr)*100)+': basamaklı ayar dengeli, SSRT tahmini daha güvenilir.');
else C('info','Durdurma başarısı %'+Math.round((1-s.pr)*100)+' (%25–75 dışı): SSRT yanlı olabilir.');
}
if(s.ssrt!=null){

else C('info','SSRT yaklaşık '+Math.round(s.ssrt)+' ms. Sağlıklı yetişkinlerde çoğunlukla 200–300 ms civarı raporlanır; dokunmatik uygulamada gecikme nedeniyle yüksek çıkabilir, kişinin kendi önceki seanslarıyla karşılaştırın.');
}
if(frt.length>=3&&gm!=null&&mean(frt)>=gm)C('warn','Başarısız durdurma RT değeri go RT değerinden yavaş veya eşit: yarış modeli varsayımı bozulmuş olabilir, SSRT güvenilmez.');
if(gm!=null&&gm>600)C('info','Go tepkileri yavaş (ort. '+Math.round(gm)+' ms): durdurma sinyalini beklemek için stratejik yavaşlama olabilir.');
if(s.go.length&&om/s.go.length>0.1)C('warn','Go omisyon oranı %'+Math.round(om/s.go.length*100)+': yönü kaçırma veya aşırı temkin.');

ANA.taskswitch=function(r,M,C,A){
rtBlock(r,M,C,A);
const sw=r.filter(x=>x.condition==='SWITCH'),rp=r.filter(x=>x.condition==='REPEAT');
const sr=rtsOf(sw),rr=rtsOf(rp),sa=accOf(sw),ra=accOf(rp);
M.push(['Geçiş / tekrar denemesi',sw.length+' / '+rp.length],['Geçiş ort. / medyan RT',sr.length?Math.round(mean(sr))+' / '+Math.round(med(sr))+' ms':'–'],['Tekrar ort. / medyan RT',rr.length?Math.round(mean(rr))+' / '+Math.round(med(rr))+' ms':'–'],['Doğruluk (geçiş / tekrar)','%'+Math.round(sa*100)+' / %'+Math.round(ra*100)]);
if(Math.min(sr.length,rr.length)<10)C('info',"Koşul başına geçerli deneme 10'un altında: geçiş maliyeti kararsız olabilir.");
if(sr.length&&rr.length){
const cost=med(sr)-med(rr),rl=cost/med(rr);
A.eff=rl;
M.push(['Geçiş maliyeti (medyan)',Math.round(cost)+' ms (%'+Math.round(rl*100)+')']);
if(cost<=0)C('info','Geçiş maliyeti görülmedi: kural değişimi tepkiyi yavaşlatmamış (az deneme veya strateji nedeniyle olabilir).');
else if(rl<0.1)C('good','Geçiş maliyeti küçük (%'+Math.round(rl*100)+'): kural değiştirme esnek.');
else if(rl<0.25)C('info','Geçiş maliyeti orta (%'+Math.round(rl*100)+', '+Math.round(cost)+' ms).');
else C('warn','Geçiş maliyeti belirgin (%'+Math.round(rl*100)+', '+Math.round(cost)+' ms): kural değişince toparlanma yavaş.');
}
if(ra-sa>=0.1)C('warn','Geçiş denemelerinde doğruluk düşük (%'+Math.round(sa*100)+' vs %'+Math.round(ra*100)+'): kural değişimi hata da üretiyor.');
const byR={};
r.forEach(x=>{if(x.correct&&x.rt!=null&&(x.extra==='RENK'||x.extra==='SEKIL'))(byR[x.extra]=byR[x.extra]||[]).push(x.rt);});
if(byR.RENK&&byR.SEKIL&&byR.RENK.length>=5&&byR.SEKIL.length>=5){
const a=med(byR.RENK),b=med(byR.SEKIL);
M.push(['Kural bazında medyan RT','RENK: '+Math.round(a)+' ms · ŞEKİL: '+Math.round(b)+' ms']);
if(Math.max(a,b)>Math.min(a,b)*1.2)C('info',(a>b?'RENK':'ŞEKİL')+' kuralı belirgin daha yavaş (%'+Math.round((Math.max(a,b)/Math.min(a,b)-1)*100)+'): iki kural arasında işleme dengesizliği.');
}
};
ANA.mot=function(r,M,C,A){
const hits=r.map(x=>parseInt(x.response)||0),nTs=r.map(x=>parseInt(x.condition.slice(1))||0);
const perfect=r.filter(x=>x.correct).length,sumT=nTs.reduce((a,b)=>a+b,0),sumH=hits.reduce((a,b)=>a+b,0);
const prop=sumT?sumH/sumT:0;
const lv={};
r.forEach((x,i)=>{const k=nTs[i];lv[k]=lv[k]||{h:0,t:0,n:0};lv[k].h+=hits[i];lv[k].t+=k;lv[k].n++;});
const ks=Object.keys(lv).map(Number).sort((a,b)=>a-b);
const hp=Math.max.apply(null,[0].concat(r.filter(x=>x.correct).map((x,i)=>parseInt(x.condition.slice(1))||0)));
const rts=r.filter(x=>x.rt!=null).map(x=>x.rt);
A.prim={label:'En yüksek mükemmel yük',val:hp,unit:'hedef',low:false};
M.push(['Deneme',r.length],['Mükemmel deneme',perfect+'/'+r.length],['Ort. doğru hedef',mean(hits)==null?'–':mean(hits).toFixed(2)],['Doğru hedef oranı','%'+Math.round(prop*100)],['En yüksek mükemmel yük (hedef sayısı)',hp],['Yük bazında (doğru/hedef)',ks.map(k=>k+' hedef: '+lv[k].h+'/'+lv[k].t+' (n='+lv[k].n+')').join(' · ')]);
if(rts.length)M.push(['Seçim süresi ort.',(mean(rts)/1000).toFixed(1)+' sn']);
if(r.length<5)C('info','Deneme sayısı az: yük uyarlaması ve kapasite tahmini kararsız (güvenilir modda 8 deneme).');
const chance=mean(nTs.map(n=>n*n/8));
if(r.length&&mean(hits)<chance*1.5)C('warn','Ortalama doğru hedef rastgele seçimle beklenen düzeye ('+chance.toFixed(1)+') yakın: yönergenin anlaşıldığından emin olun.');
else if(prop>=0.9)C('good','Doğru hedef oranı yüksek (%'+Math.round(prop*100)+'): çoklu hedef takibi güçlü.');
else if(prop<0.6)C('warn','Doğru hedef oranı düşük (%'+Math.round(prop*100)+'): hedeflerin takibi hareket sırasında kayboluyor.');
else C('info','Doğru hedef oranı orta (%'+Math.round(prop*100)+').');
if(hp>=5)C('info','En yüksek yüke (5 hedef) ulaşıldı: tavan etkisi olabilir, gerçek kapasite daha yüksek olabilir.');
};
ANA.timing=function(r,M,C,A){
const t=timingErrs(r),n=r.length;
M.push(['Deneme',n],['Dokunuş yok',t.miss]);
if(t.miss>=2)C('warn',t.miss+' denemede dokunuş yapılmadı: dikkat kaybı veya hedefi takip edememe.');
if(!t.errs.length){C('warn','Geçerli dokunuş yok.');return;}
const ab=t.errs.map(Math.abs),mb=mean(ab),bias=mean(t.errs),s=sd(t.errs);
const h100=t.errs.filter(e=>Math.abs(e)<=100).length,h50=t.errs.filter(e=>Math.abs(e)<=50).length;
A.prim={label:'Ort. mutlak hata',val:mb,unit:'ms',low:true};
M.push(['Ort. / medyan mutlak hata',Math.round(mb)+' / '+Math.round(med(ab))+' ms'],['Ort. yönlü hata (+geç / −erken)',Math.round(bias)+' ms'],['Tutarlılık (yönlü hata SS)',s==null?'–':Math.round(s)+' ms'],['İsabet ±100 ms / ±50 ms',h100+'/'+n+' · '+h50+'/'+n]);
const names={1:'Yavaş',2:'Orta',3:'Hızlı'},lvAbs={};
[1,2,3].forEach(l=>{
const e=r.filter(x=>x.condition==='V'+l&&x.response!=='NONE').map(x=>Math.abs(parseInt(x.response))).filter(v=>isFinite(v));
if(e.length)lvAbs[l]=mean(e);
});
const lk=Object.keys(lvAbs);
if(lk.length)M.push(['Hıza göre ort. mutlak hata',lk.map(k=>names[k]+': '+Math.round(lvAbs[k])+' ms').join(' · ')]);
if(mb<=50)C('good','Ortalama mutlak hata '+Math.round(mb)+' ms: zamanlama çok isabetli.');
else if(mb<=100)C('info','Ortalama mutlak hata '+Math.round(mb)+' ms: zamanlama orta-iyi düzeyde.');
else C('warn','Ortalama mutlak hata '+Math.round(mb)+' ms: hedefin varış anını tahmin etmede belirgin sapma.');
if(bias<-40)C('info','Sistematik ERKEN eğilim ('+Math.round(bias)+' ms): hedefi beklemeden öne geçme, hızı olduğundan yüksek tahmin etme.');
else if(bias>40)C('info','Sistematik GEÇ eğilim (+'+Math.round(bias)+' ms): hız tahmini düşük veya karar gecikmesi. Cihaz dokunma gecikmesi de küçük bir geç kayma ekler.');
else C('good','Yönlü hata küçük ('+Math.round(bias)+' ms): sistematik erken/geç kayma yok.');
if(s!=null){
if(s<60)C('good','Tutarlılık yüksek (SS '+Math.round(s)+' ms): zamanlama kararlı.');
else if(s>120)C('warn','Zamanlama dalgalı (SS '+Math.round(s)+' ms): denemeden denemeye büyük fark var.');
}
if(lvAbs[1]!=null&&lvAbs[3]!=null&&lvAbs[3]>lvAbs[1]*1.5)C('info','Hızlı hedeflerde hata yavaşlara göre %'+Math.round((lvAbs[3]/lvAbs[1]-1)*100)+' yüksek: yüksek hızlı hedefleri öngörme zayıf.');
if(n<15)C('info',"Deneme sayısı 15'in altında: hız bazlı karşılaştırmalar kararsız olabilir.");
};

function analyze(mod,r){

}

const GEN={Erkek:'Erkek',Kadin:'Kadın'},DOM={Sag:'Sağ',Sol:'Sol'};
const shortT=t=>t.replace(/^\d+\.\s*/,'');

function trendOf(p,pv,cur){
if(!pv&&pv!==0)return null;
const base=Math.abs(pv)||1,ch=(cur-pv)/base,fv=v=>(Math.round(v*100)/100)+(p.unit?' '+p.unit:'');
let verdict;
if(Math.abs(ch)<0.05)verdict='belirgin fark yok (±%5 içinde)';
else verdict=((p.low?ch<0:ch>0)?'iyileşme':'gerileme')+' %'+Math.round(Math.abs(ch)*100);
return'Önceki seansa göre ('+p.label+'): '+fv(pv)+' → '+fv(cur)+' · '+verdict;
}
function buildReport(id){

if(prev&&A.prim){const pa=analyze(k,prev.rows.filter(x=>!x.practice));if(pa.prim)trend=trendOf(A.prim,pa.prim.val,A.prim.val);}

});

const tsw=tests.find(t=>t.mod==='taskswitch');
if(tsw&&tsw.eff!=null&&tb&&tb.prim)cross.push('Esneklik: Görev Değiştirme testinde geçiş maliyeti %'+Math.round(tsw.eff*100)+'; Trail B süresi '+tb.prim.val.toFixed(1)+' sn. İki ölçüm birbirini doğruluyorsa (ikisi de iyi veya ikisi de zayıf) esneklik bulgusu daha güvenilirdir.');

const drift=tests.filter(t=>t.Cm.some(c=>c.k==='warn'&&c.t.indexOf('yavaşlama')>=0)).map(t=>shortT(t.title));

gen:new Date().toLocaleString('tr-TR'),tests:tests,good:good.slice(0,10),warn:warn.slice(0,10),cross:cross,next:next};

function reportHtml(R){
const li=a=>a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<div class="rp-sub">Kayıt yok.</div>';
let h='<div class="rp-title">SPPLab Kişisel Performans Raporu</div><div>ID: <b>'+esc(R.id)+'</b></div><div class="rp-sub">'+esc(R.prof)+'</div><div class="rp-sub">Oluşturma: '+esc(R.gen)+' · '+R.tests.length+' test</div>';
h+='<div class="rp-sec"><h4>Güçlü yönler</h4>'+li(R.good)+'</div>';
h+='<div class="rp-sec"><h4>Gelişime açık yönler</h4>'+li(R.warn)+'</div>';
if(R.cross.length)h+='<div class="rp-sec"><h4>Testler arası bütünsel değerlendirme</h4>'+li(R.cross)+'</div>';
h+='<div class="rp-sec"><h4>Test bazında detaylar</h4>';
R.tests.forEach(t=>{
h+='<div class="rp-card"><div class="rp-ct">'+esc(t.title)+'<span>'+modeLbl(t.mode)+' · '+esc(t.date)+' · '+t.n+' seans</span></div><table>'+t.M.map(m=>'<tr><td>'+esc(m[0])+'</td><td>'+esc(m[1])+'</td></tr>').join('')+'</table>';
h+=t.Cm.map(c=>'<div class="rp-cm" style="border-color:'+AC[c.k]+'">'+esc(c.t)+'</div>').join('');
if(t.trend)h+='<div class="rp-tr">'+esc(t.trend)+'</div>';
h+='</div>';
});
h+='</div><div class="rp-sec"><h4>Sonraki seans önerisi</h4>'+li(R.next)+'</div><div class="rp-note">'+esc(DISCLAIMER)+'</div>';
return h;
}
function reportText(R){
const L=['SPPLab Kişisel Performans Raporu','ID: '+R.id,R.prof,'Oluşturma: '+R.gen];
const add=(t,a)=>{L.push('',t);(a.length?a:['Kayıt yok.']).forEach(x=>L.push('- '+x));};
add('GÜÇLÜ YÖNLER',R.good);add('GELİŞİME AÇIK YÖNLER',R.warn);
if(R.cross.length)add('TESTLER ARASI BÜTÜNSEL DEĞERLENDİRME',R.cross);
L.push('','TEST BAZINDA DETAYLAR');
R.tests.forEach(t=>{
L.push('','== '+t.title+' ('+modeLbl(t.mode)+', '+t.date+', '+t.n+' seans) ==');
t.M.forEach(m=>L.push(m[0]+': '+m[1]));
t.Cm.forEach(c=>L.push('* '+c.t));
if(t.trend)L.push('> '+t.trend);
});
add('SONRAKİ SEANS ÖNERİSİ',R.next);
L.push('',DISCLAIMER);
return L.join('\n');
}
let lastReport=null;
function openReport(){
const id=$('athlete-id').value.trim();
const R=buildReport(id);
if(!R){alert('Bu Sporcu ID için kayıtlı tamamlanmış test yok. Önce en az bir testi bitirin.');return;}
lastReport=R;
$('report-body').innerHTML=reportHtml(R);
$('report-overlay').classList.add('open');
$('report-overlay').scrollTop=0;
}
function copyReport(){
if(!lastReport)return;
const txt=reportText(lastReport),btn=$('rep-copy');
const done=()=>{btn.textContent='Kopyalandı';setTimeout(()=>{btn.textContent='Kopyala';},1500);};
const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Kopyalanamadı.');}document.body.removeChild(ta);};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(fallback);else fallback();
}

/* ---------- Başlat / Durdur / Bitir ---------- */
function readAthlete(){
const id=$('athlete-id').value.trim().slice(0,32);
const age=Number($('athlete-age').value),exp=Number($('athlete-exp').value);
if(!id){alert('Sporcu ID gerekli (gerçek isim yerine takma ID kullanın).');return null;}
if(!(age>=5&&age<=99)){alert('Yaş 5–99 arasında olmalı.');return null;}
if(!(exp>=0&&exp<=80)){alert('Spor yılı 0–80 arasında olmalı.');return null;}
return{id:id,age:age,exp:exp,gender:$('athlete-gender').value,sport:$('athlete-sport').value.trim().slice(0,32)||'Genel',dominant:$('athlete-dominant').value,screen:screen.width+'x'+screen.height+'@'+(window.devicePixelRatio||1),ua:navigator.userAgent};
}

function resetLayout(keepStats){
T.clear();stopClock();cvStop();
const mod=moduleSelect.value,m=MODS[mod];
instructionCard.style.display='block';
$('instr-eval').style.display='';$('instr-score-formula').style.display='';
$('instr-title').textContent=m.title;$('instr-text').textContent=m.text+suffix(mod);
$('instr-eval').textContent=m.eval;$('instr-score-formula').textContent=m.formula;
$('opt-digit').style.display=mod==='digit_span'?'flex':'none';
$('opt-nback').style.display=mod==='nback'?'flex':'none';
[circle,zoneBox,dualButtons,spatialGrid,memoryGrid,numpadGrid,trailArea,cv].forEach(e=>e.style.display='none');
circle.className='';circle.innerHTML='';gameArea.classList.remove('has-buttons');
memoryGrid.innerHTML='';trailArea.innerHTML='';
if(!keepStats){
statTimer.textContent='0.00 s';statScore.textContent='0';statErrors.textContent='0';
statTrials.textContent=openFor(m)?'–':('0/'+getCfg(mod)[1]);
}
}

function startTest(){
const athlete=readAthlete();if(!athlete)return;
const mod=moduleSelect.value,m=MODS[mod];
S.run++;S.active=true;S.mod=mod;S.athlete=athlete;S.rel=rel();
S.rows=[];S.idx=0;S.waiting=false;S.resp=null;S.early=null;S.ctx={};
const cf=getCfg(mod);
S.practiceN=cf[0];S.total=cf[1];S.open=openFor(m);
if(m.planK)S.ctx.plan=mkPlan(S.practiceN,S.total,m.planK[S.rel?1:0]);
S.sessionId=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
resetLayout(false);
instructionCard.style.display='none';
$('opt-digit').style.display='none';$('opt-nback').style.display='none';
startBtn.disabled=true;stopBtn.disabled=false;exportBtn.disabled=true;reportBtn.disabled=true;moduleSelect.disabled=true;modeSelect.disabled=true;
m.setup();
requestWake();
startClock();
nextTrial();
}

function endUI(){startBtn.disabled=false;stopBtn.disabled=true;moduleSelect.disabled=false;modeSelect.disabled=false;reportBtn.disabled=false;exportBtn.disabled=S.rows.length===0;}

function stopTest(msg){
S.active=false;S.run++;S.waiting=false;S.resp=null;S.early=null;
T.clear();stopClock();releaseWake();
if('speechSynthesis' in window)speechSynthesis.cancel();
resetLayout(true);
if(typeof msg==='string')$('instr-text').textContent=msg+' '+$('instr-text').textContent;
endUI();
}

function finishTest(){
if(!S.active)return;
const elapsed=((performance.now()-S.clockStart)/1000).toFixed(1);
S.active=false;S.run++;S.waiting=false;S.resp=null;S.early=null;
T.clear();stopClock();releaseWake();
const m=MODS[S.mod],r=S.rows.filter(x=>!x.practice),score=computeScore();
const lines=['Mod: '+modeLbl(S.rel?'GUVENILIR':'HIZLI'),'Süre: '+elapsed+' sn','<b>Puan: '+score+'</b>'];
let extraHtml='';
if(r.length){
if(['trailA','trailB','memory','digit_span','mot','timing'].indexOf(S.mod)<0){
lines.push('Doğruluk: %'+Math.round(okRows(r).length/r.length*100));
const rts=rtsOf(r);
if(rts.length){
const best=Math.min.apply(null,rts),worst=Math.max.apply(null,rts);
lines.push('Ort. tepki süresi: '+msSn(Math.round(mean(rts))),
'Medyan tepki süresi: '+msSn(Math.round(med(rts))),
'<span style="color:#00e676">En iyi: '+msSn(best)+'</span>',
'<span style="color:#ff5252">En kötü: '+msSn(worst)+'</span>',
'Fark (en kötü − en iyi): '+(worst-best)+' ms',
'Tüm süreler (ms): '+rts.join(' · '));
}else lines.push('Geçerli tepki süresi yok (doğru cevap yok).');
}
lines.push('Hata: '+errCount(r));
if(m.extra)Array.prototype.push.apply(lines,m.extra(r));
try{
const A=analyze(S.mod,r);
if(A.Cm.length){
extraHtml='<div style="margin-top:8px"><b>Yorumlar (bu seans):</b></div>'+A.Cm.map(c=>'<div style="border-left:3px solid '+AC[c.k]+';padding:2px 6px;margin:3px 0;font-size:.74rem">'+esc(c.t)+'</div>').join('')+'<div style="color:#888;font-size:.7rem;margin-top:6px">Tüm testlerin birleşik yorumu için "Rapor" düğmesini kullanın.</div>';
}
}catch(e){}
}
resetLayout(true);
$('instr-title').textContent="Test Tamamlandı!";
$('instr-text').innerHTML=lines.join('<br>')+extraHtml;
$('instr-eval').style.display='none';$('instr-score-formula').style.display='none';
endUI();
saveSession();
}

/* ---------- Veri ---------- */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return[];}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function setSync(t){$('sync-status').textContent=t;}
const COMPACT=['sessionId','timestamp','athleteId','age','gender','sport','dominantSide','experienceYears','module','mode','trial','practice','condition','response','rt','cum','correct','note','score','extra'];
function compact(row){const o={};COMPACT.forEach(k=>{o[k]=row[k];});return o;}
function saveSession(){
if(!S.rows.length)return;
let all=lsGet('spplab_sessions');
all.push({sessionId:S.sessionId,rows:S.rows.map(compact)});
all=all.slice(-40);
while(all.length>1&&!lsSet('spplab_sessions',all))all.shift();
if($('consent').checked&&API_URL){
const q=lsGet('spplab_pending');q.push({sessionId:S.sessionId,rows:S.rows});lsSet('spplab_pending',q);
flushPending();
}else setSync($('consent').checked?'API_URL tanımlı değil: veri cihazda.':'Rıza verilmedi: veri sadece cihazda.');
}
async function flushPending(){
if(!API_URL||!$('consent').checked)return;
const q=lsGet('spplab_pending');if(!q.length)return;
const rest=[];
for(const b of q){
try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:API_TOKEN,sessionId:b.sessionId,rows:b.rows})});}
catch(e){rest.push(b);}
}
lsSet('spplab_pending',rest);
setSync(rest.length?(rest.length+' oturum gönderilmeyi bekliyor'):'Gönderildi (sunucu yanıtı doğrulanamaz)');
}
window.addEventListener('online',flushPending);

const CSV_COLS=[['sessionId','Oturum_ID'],['timestamp','Zaman_Damgasi'],['version','Surum'],['athleteId','Sporcu_ID'],['age','Yas'],['gender','Cinsiyet'],['sport','Brans'],['dominantSide','Baskin_Taraf'],['experienceYears','Deneyim_Yili'],['screen','Ekran'],['userAgent','Tarayici'],['module','Modul'],['mode','Mod'],['trial','Deneme'],['practice','Alistirma'],['condition','Kosul'],['response','Yanit'],['rt','Reaksiyon_veya_Aralik_ms'],['cum','Kumulatif_ms'],['correct','Dogru_Mu'],['note','Aciklama'],['extra','Ek_Bilgi'],['score','Hesaplanan_Puan']];
function csvEsc(v){
if(v===null||v===undefined)return'';
let s=String(v);
if(typeof v==='string'&&/^[=+\-@\t\r]/.test(s))s="'"+s;
if(/[",;\n\r]/.test(s))s='"'+s.replace(/"/g,'""')+'"';
return s;
}
function exportCSV(){
if(!S.rows.length)return;
const head=CSV_COLS.map(c=>c[1]).join(',');
const body=S.rows.map(r=>CSV_COLS.map(c=>csvEsc(r[c[0]])).join(',')).join('\n');
const blob=new Blob(["\uFEFF"+head+"\n"+body],{type:'text/csv;charset=utf-8'});
const url=URL.createObjectURL(blob),a=document.createElement('a');
a.href=url;a.download='SPPLab_'+(S.athlete?S.athlete.id:'data')+'_'+S.mod+'_'+new Date().toISOString().slice(0,10)+'.csv';
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- Olaylar ---------- */
moduleSelect.addEventListener('change',()=>resetLayout(false));
modeSelect.addEventListener('change',()=>resetLayout(false));
startBtn.addEventListener('click',()=>{initAudio();startTest();});
stopBtn.addEventListener('click',()=>stopTest());
exportBtn.addEventListener('click',exportCSV);
reportBtn.addEventListener('click',openReport);
$('rep-close').addEventListener('click',()=>$('report-overlay').classList.remove('open'));
$('rep-copy').addEventListener('click',copyReport);
$('rep-print').addEventListener('click',()=>{try{window.print();}catch(e){alert('Yazdırma bu ortamda desteklenmiyor. "Kopyala" düğmesini kullanın.');}});
circle.addEventListener('pointerdown',e=>{
if(S.active&&!S.waiting&&S.early){if(e.cancelable)e.preventDefault();S.early(e);return;}
input('circle',e);
});
cv.addEventListener('pointerdown',e=>input('cv',e));
$('antisaccade-left-zone').addEventListener('pointerdown',e=>input('zoneL',e));
$('antisaccade-right-zone').addEventListener('pointerdown',e=>input('zoneR',e));
btnLeft.addEventListener('pointerdown',e=>input('left',e));
btnRight.addEventListener('pointerdown',e=>input('right',e));
cones.forEach(c=>c.addEventListener('pointerdown',e=>input('cone:'+c.dataset.key,e)));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.active)stopTest('Sekme arka plana alındığı için test durduruldu.');});

resetLayout(false);
flushPending();
</script>
